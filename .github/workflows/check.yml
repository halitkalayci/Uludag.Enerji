name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict
      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain for scripts/check.conf (bootstrap 2026-11-19): .NET 9 SDK, Node 24, client deps.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ECommerce/client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix ECommerce/client
      # --fast is for the inner loop only; CI always runs the full contract (docs/testing.md).
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      # a project that adopted ANEW (scripts/adopt) has no extensions/: the job passes without it
      - uses: actions/setup-node@v4
        if: hashFiles('extensions/vscode/package.json') != ''
        with:
          node-version: 24
      - name: Install (dev dependencies only)
        if: hashFiles('extensions/vscode/package.json') != ''
        run: npm ci
      - name: Typecheck and tests (the integration tests run the real scripts/status and scripts/gate)
        if: hashFiles('extensions/vscode/package.json') != ''
        run: npm test
      - name: Package the .vsix
        if: hashFiles('extensions/vscode/package.json') != ''
        run: npm run package
