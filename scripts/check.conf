# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Generated by bootstrap 2026-11-19. Format: scripts/check.conf.example. Runs from the repo root.
# Resource hygiene inventory (docs/testing.md):
#   build        → MSBuild worker nodes, VBCSCompiler (Roslyn server); writes bin/ obj/ (overwritten each run)
#   client-build → node + esbuild service (exit with the build); writes dist/ .angular/cache (overwritten)

# --- prerequisites ---
requires build: dotnet --version | grep -Eq '^(9|[1-9][0-9])\.'
requires client-build: node -e "process.exit(+process.versions.node.split('.')[0] >= 20 ? 0 : 1)"
requires client-build: test -d ECommerce/client/node_modules

# --- steps ---
# resource hygiene: no MSBuild node reuse (-nodeReuse:false), no shared compiler server (UseSharedCompilation=false)
build [fast]: dotnet build Uludag.Enerji.slnx -nologo -v:q -nodeReuse:false -p:UseSharedCompilation=false
client-build [fast]: npm --prefix ECommerce/client run build --silent

# --- planned (activated by the test-infrastructure spec; selector split, never a list) ---
# test [fast]: dotnet test Uludag.Enerji.slnx --no-build -nologo -v:q -nodeReuse:false --filter "Category!=Integration"
# requires integration: docker info
# integration: dotnet test Uludag.Enerji.slnx --no-build -nologo -v:q -nodeReuse:false --filter "Category=Integration"
# client-test [fast]: npm --prefix ECommerce/client test -- --watch=false
# format [fast]: npx --prefix ECommerce/client prettier --check "ECommerce/client/src/**/*.{ts,html,scss}"   (after B-4)
